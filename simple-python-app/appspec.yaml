version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/AWS-Continuous-Integration-Project/simple-python-app
hooks:
  BeforeInstall:
    - location: scripts/stop_server.sh
      timeout: 300
      runas: ubuntu
  AfterInstall:
    - location: scripts/install_deps.sh
      timeout: 300
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: ubuntu
